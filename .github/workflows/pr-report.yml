name: Pull request report

# Comments one summary of all docker-build.yml builds of the run on the open pull request of the branch.
# A tool that follows the pull request then learns that all builds ended.
#
# Caller, after the build jobs:
#   jobs:
#     report:
#       needs: build
#       if: always()
#       uses: ALERTua/ci-workflows/.github/workflows/pr-report.yml@v4.0.0
#       permissions:
#         pull-requests: write

on:
  workflow_call: {}

permissions: {}

jobs:
  report:
    name: Comment the build results
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # comment of the build results on the open pull request of the branch
    steps:
      - name: Get the results of the builds
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-result-*
          path: results

      - name: Comment the results on the open pull request of the branch
        # a pull request from a fork gets a read-only token and cannot comment
        if: github.event.pull_request.head.repo.fork != true
        # a failed comment must not turn the run red
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr="$PR_NUMBER"
          if [ -z "$pr" ]; then
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          fi
          if [ -z "$pr" ]; then
            echo "No open pull request for $BRANCH, no comment"
            exit 0
          fi
          files=$(find results -name result.json 2>/dev/null | sort)
          if [ -z "$files" ]; then
            body="Docker build: no build result. [Run]($RUN_URL)"
          else
            # one table row for each build, and success only when each build succeeded
            rows=$(jq -r '"| `\(.target)` | \(.outcome) | \(.builder) | \(.seconds) s |"' $files)
            failed=$(jq -r 'select(.outcome != "success") | .target' $files)
            if [ -z "$failed" ]; then status=success; else status=failure; fi
            body=$(printf 'Docker build: %s. [Run](%s)\n\n| Target | Result | Builder | Build step |\n|---|---|---|---|\n%s\n' "$status" "$RUN_URL" "$rows")
          fi
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$body"

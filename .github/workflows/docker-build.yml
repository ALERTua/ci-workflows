name: Docker build

# Builds the Docker image of the caller repository and pushes it to ghcr.io.
# The build runs on buildkit of alert-server when buildkit answers through the tailnet,
# otherwise on this GitHub-hosted runner with the GitHub Actions cache.
# The job joins the tailnet with the GitHub OIDC token (Tailscale workload identity
# federation), so no repository needs a secret.
#
# Caller:
#   jobs:
#     build:
#       uses: ALERTua/ci-workflows/.github/workflows/docker-build.yml@v4.0.0
#
# Image tags: a push to the default branch gives edge, a push to another branch gives the branch name.
# A git tag v1.2.3 gives 1.2.3, 1.2 and 1, and latest only when it is the highest stable version of the
# repository. A pull request builds the image but never pushes it.
#       permissions:
#         contents: read
#         packages: write
#         id-token: write

on:
  workflow_call:
    inputs:
      target:
        description: Dockerfile stage to build. Empty builds the last stage.
        type: string
        default: ""
      suffix:
        description: Suffix for each image tag, for example -cuda
        type: string
        default: ""
      prepare:
        description: Shell commands that run after the checkout and before the build
        type: string
        default: ""
      free-disk-space:
        description: Remove big unused tools from the GitHub-hosted runner before a build on it
        type: boolean
        default: false
      context:
        description: Build context path
        type: string
        default: .
      alert-server:
        description: Build on buildkit of alert-server when it answers. False always builds on the GitHub-hosted runner.
        type: boolean
        default: true
      push:
        description: Push the image of a manual run on a branch other than the default branch, with the branch name as the tag
        type: boolean
        default: false
    outputs:
      builder:
        description: Where the image was built, alert-server or github
        value: ${{ jobs.build.outputs.builder }}

permissions: {}

env:
  # Tailscale workload identity federation: identifiers, not secrets
  TS_CLIENT_ID: TAys5tptfH11CNTRL-k82Za2AL4a11CNTRL
  TS_AUDIENCE: api.tailscale.com/TAys5tptfH11CNTRL-k82Za2AL4a11CNTRL
  # buildkit on alert-server; the tailnet policy gives tag:github-ci only this port
  BUILDKIT_HOST: 100.76.242.86
  BUILDKIT_PORT: "1234"

jobs:
  build:
    name: Build the image
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout of the caller repository
      packages: write # push of the image to ghcr.io
      id-token: write # Tailscale accepts the GitHub OIDC token instead of a key
    outputs:
      builder: ${{ steps.result.outputs.builder }}
      seconds: ${{ steps.duration.outputs.seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the build context must not carry the GitHub token
          persist-credentials: false

      - name: Join the tailnet without a key
        id: tailscale
        # Code of a pull request from a fork never reaches alert-server. Forks get no OIDC
        # token, and pull_request_target and workflow_run run with the rights of this
        # repository, so they skip alert-server explicitly. A Dependabot pull request brings
        # dependency versions that nobody reviewed yet, so it builds on GitHub too.
        if: >-
          inputs.alert-server &&
          github.event.pull_request.head.repo.fork != true &&
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event_name != 'pull_request_target' &&
          github.event_name != 'workflow_run'
        continue-on-error: true
        timeout-minutes: 3
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ env.TS_CLIENT_ID }}
          audience: ${{ env.TS_AUDIENCE }}
          tags: tag:github-ci

      - name: Check whether buildkit on alert-server answers
        id: probe
        if: steps.tailscale.outcome == 'success'
        run: |
          # the tailnet route can need a few seconds after the join
          if timeout 15 bash -c 'until (exec 3<>"/dev/tcp/$BUILDKIT_HOST/$BUILDKIT_PORT") 2>/dev/null; do sleep 1; done'; then
            echo "answers=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildkit on alert-server does not answer, the build runs on this runner"
          fi

      - name: Use buildkit on alert-server
        id: remote
        if: steps.probe.outputs.answers == 'true'
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: tcp://${{ env.BUILDKIT_HOST }}:${{ env.BUILDKIT_PORT }}

      - name: Use a builder on this runner
        if: steps.remote.outcome != 'success'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Record the builder
        id: result
        env:
          REMOTE: ${{ steps.remote.outcome == 'success' }}
          CACHE_SCOPE: ${{ inputs.target || 'default' }}
        run: |
          # buildkit on alert-server keeps its own layer cache; the GitHub cache is only for this runner
          if [ "$REMOTE" = "true" ]; then
            builder=alert-server
            cache_from=""
            cache_to=""
          else
            builder=github
            cache_from="type=gha,scope=$CACHE_SCOPE"
            cache_to="type=gha,mode=max,scope=$CACHE_SCOPE"
          fi
          {
            echo "builder=$builder"
            echo "cache-from=$cache_from"
            echo "cache-to=$cache_to"
          } >> "$GITHUB_OUTPUT"
          echo "Builder: $builder" >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space for the build on this runner
        if: inputs.free-disk-space && steps.result.outputs.builder == 'github'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Prepare the build context
        if: inputs.prepare != ''
        env:
          PREPARE: ${{ inputs.prepare }}
        run: eval "$PREPARE"

      - name: Decide the push and the latest tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH_INPUT: ${{ inputs.push }}
        run: |
          # a pull request never pushes; a manual run pushes from the default branch, from a git tag, or with the input push
          push=true
          case "$EVENT" in
            pull_request|pull_request_target)
              push=false ;;
            workflow_dispatch)
              if [ "$REF_TYPE" != tag ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ] && [ "$PUSH_INPUT" != true ]; then
                push=false
              fi ;;
          esac
          # latest only for the highest stable version, so a fix of an older line moves only its own 1 and 1.0
          latest=false
          major_zero=false
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            case "$version" in 0.*) major_zero=true ;; esac
            if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              highest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' \
                | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
              if [ "$version" = "$highest" ]; then
                latest=true
              fi
            fi
          fi
          {
            echo "push=$push"
            echo "latest=$latest"
            echo "major-zero=$major_zero"
          } >> "$GITHUB_OUTPUT"
          echo "Push: $push, latest: $latest" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # latest comes only from the step above, never from a branch
          flavor: |
            latest=false
            suffix=${{ inputs.suffix }},onlatest=true
          # a major version zero is not stable, so a git tag v0.y.z gives no tag 0
          tags: |
            type=edge
            type=ref,event=branch,enable={{is_not_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ steps.plan.outputs.major-zero != 'true' }}
            type=raw,value=latest,enable=${{ steps.plan.outputs.latest == 'true' }}

      - name: Log in to ghcr.io
        if: steps.plan.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record the start of the build
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build, and push when the step "Decide the push" allows it
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          target: ${{ inputs.target }}
          push: ${{ steps.plan.outputs.push == 'true' }}
          # attach build provenance and an SBOM to each pushed image
          provenance: ${{ steps.plan.outputs.push == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ steps.plan.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.result.outputs.cache-from }}
          cache-to: ${{ steps.result.outputs.cache-to }}

      - name: Record the duration of the build
        id: duration
        if: always() && steps.start.outcome == 'success'
        env:
          START: ${{ steps.start.outputs.epoch }}
        run: |
          seconds=$(( $(date +%s) - START ))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "Build step: ${seconds} s" >> "$GITHUB_STEP_SUMMARY"

      # pr-report.yml reads these files after all builds of the run and comments one summary
      - name: Write the build result
        if: always()
        env:
          TARGET: ${{ inputs.target || 'default' }}
          OUTCOME: ${{ steps.build.outcome }}
          BUILDER: ${{ steps.result.outputs.builder }}
          SECONDS_SPENT: ${{ steps.duration.outputs.seconds }}
        run: |
          mkdir -p "$RUNNER_TEMP/build-result"
          jq -n --arg target "$TARGET" --arg outcome "$OUTCOME" --arg builder "$BUILDER" --arg seconds "$SECONDS_SPENT" \
            '{target: $target, outcome: $outcome, builder: $builder, seconds: $seconds}' > "$RUNNER_TEMP/build-result/result.json"

      - name: Keep the build result for the report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-result-${{ inputs.target || 'default' }}
          path: ${{ runner.temp }}/build-result/result.json
          retention-days: 1

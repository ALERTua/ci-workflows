name: Pick runner

# Chooses where the next job of the caller runs: on the multirunner runner of
# alert-server when multirunner has a runner, otherwise on a GitHub-hosted runner.
# The job joins the tailnet with the GitHub OIDC token (Tailscale workload identity
# federation), so no repository needs a secret.
#
# Caller:
#   jobs:
#     pick-runner:
#       uses: ALERTua/ci-workflows/.github/workflows/pick-runner.yml@v1
#       permissions:
#         id-token: write
#     test:
#       needs: pick-runner
#       runs-on: ${{ fromJson(needs.pick-runner.outputs.runner) }}

on:
  workflow_call:
    inputs:
      self-hosted:
        description: JSON runs-on value for the alert-server runner
        type: string
        default: '["self-hosted","alert-server"]'
      fallback:
        description: JSON runs-on value when alert-server has no runner
        type: string
        default: '"ubuntu-latest"'
    outputs:
      runner:
        description: JSON value for runs-on, use it with fromJson
        value: ${{ jobs.pick.outputs.runner }}

permissions: {}

env:
  # Tailscale workload identity federation: identifiers, not secrets
  TS_CLIENT_ID: TAys5tptfH11CNTRL-k82Za2AL4a11CNTRL
  TS_AUDIENCE: api.tailscale.com/TAys5tptfH11CNTRL-k82Za2AL4a11CNTRL
  # multirunner /metrics on alert-server; the tailnet policy gives tag:github-ci only this port
  RUNNER_METRICS_URL: http://100.76.242.86:8152/metrics

jobs:
  pick:
    name: Pick the runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # Tailscale accepts the GitHub OIDC token instead of a key
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Join the tailnet without a key
        id: tailscale
        # pull requests from forks get no OIDC token and use a GitHub runner
        if: github.event.pull_request.head.repo.fork != true
        continue-on-error: true
        timeout-minutes: 3
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ env.TS_CLIENT_ID }}
          audience: ${{ env.TS_AUDIENCE }}
          tags: tag:github-ci

      - name: Use the alert-server runner when multirunner has one, otherwise a GitHub runner
        id: pick
        env:
          TAILSCALE_OK: ${{ steps.tailscale.outcome == 'success' }}
          SELF_HOSTED: ${{ inputs.self-hosted }}
          FALLBACK: ${{ inputs.fallback }}
        run: |
          runner="$FALLBACK"
          if [ "$TAILSCALE_OK" = "true" ]; then
            active=$(curl -fsS --connect-timeout 5 --max-time 8 --retry 4 --retry-delay 2 --retry-all-errors "$RUNNER_METRICS_URL" \
              | awk '/^multirunner_runners_active/ {s += $2} END {print int(s)}') || active=0
            if [ "${active:-0}" -ge 1 ]; then
              runner="$SELF_HOSTED"
            fi
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "Selected runner: $runner"
